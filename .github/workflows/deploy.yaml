name: Deploy clickhouse to VDS

on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: self-hosted


    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
      
      - name: Set permissions for Airflow directories
        run: |
          mkdir -p logs plugins dags
          chown -R 50000:0 logs plugins dags dbt_project
      
      - name: Run Docker Compose Up
        env:
          CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          AIRFLOW_ADMIN_USER: ${{ secrets.AIRFLOW_ADMIN_USER }}
          AIRFLOW_ADMIN_PASSWORD: ${{ secrets.AIRFLOW_ADMIN_PASSWORD }}
        run:
          docker compose up -d --remove-orphans
