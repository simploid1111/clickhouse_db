version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse_db
    restart: always
    ports:
      - "8123:8123"  # HTTP интерфейс (для интеграций и веб-клиентов)
      - "9000:9000"  # Нативный протокол (для clickhouse-client и кода)
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ch_data:/var/lib/clickhouse
      - ch_logs:/var/log/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  ch_data:
    driver: local
  ch_logs:
    driver: local
